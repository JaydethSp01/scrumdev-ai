# =============================================================================
# ScrumDev AI - nginx reverse proxy (edge)
# -----------------------------------------------------------------------------
# Enruta:
#   /api/*    -> api_gateway:8080  (sin el prefijo /api)
#   /ws/*     -> api_gateway:8080  (WebSockets con Upgrade/Connection)
#   /healthz  -> respuesta interna 200 (healthcheck del propio nginx)
#   /         -> frontend:3000     (Next.js)
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format con X-Forwarded-For para trazas detrás de un LB externo
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Tamaño máximo de uploads (relevante para git_connector / attachments).
    client_max_body_size 25m;

    # gzip básico
    gzip on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;
    gzip_min_length 1024;

    # Mapping para WebSocket Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstreams nombrados (resolución DNS interna de docker compose)
    upstream api_gateway_upstream {
        server api_gateway:8080;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream notification_upstream {
        server notification_service:8010;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Healthcheck barato para el propio nginx (lo usa el HEALTHCHECK del compose)
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # -------------- API REST hacia api_gateway --------------
        # /api/* -> http://api_gateway:8080/*  (se quita el prefijo /api)
        location /api/ {
            proxy_pass         http://api_gateway_upstream/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Timeouts pensados para llamadas LLM largas (Claude streaming)
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering       off;
        }

        # -------------- WebSockets --------------
        # /ws/* -> notification_service:8010/ws/*  (notificaciones live al frontend)
        location /ws/ {
            proxy_pass         http://notification_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------- Frontend Next.js --------------
        # _next/static y _next/image deben pasar también al server de Next
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }

    # Permite añadir más server blocks (TLS, subdominios) sin tocar este archivo
    include /etc/nginx/conf.d/*.conf;
}
