# Compose extendido con RabbitMQ y Temporal (fase 2). Uso opcional.
services:
  postgres:
    image: postgres:16-alpine
    container_name: scrumdev-postgres
    environment:
      POSTGRES_USER: scrumdev
      POSTGRES_PASSWORD: scrumdev
      POSTGRES_DB: scrumdev_ai
    ports:
      - "5432:5432"
    volumes:
      - scrumdev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scrumdev-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: scrumdev-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Broker Kafka (Redpanda: API Kafka-compatible, single-binary, sin Zookeeper).
  # Los servicios publican DomainEvents aquí cuando KAFKA_ENABLED=true
  # (topics: scrumdev.workflow / .agent / .deploy / .events). Validado E2E.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: scrumdev-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  temporal:
    image: temporalio/auto-setup:latest
    container_name: scrumdev-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=scrumdev
      - POSTGRES_PWD=scrumdev
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres

volumes:
  scrumdev_postgres_data:
