# =============================================================================
# CD STAGING
# Trigger: merge a `develop` o tags `staging-*`
# Acción:   build & push de imágenes a GHCR con tag `:staging`
# Deploy:   REAL -> HF Space staging (backend+ML) + Vercel staging hook (frontend)
# =============================================================================
name: CD Staging

on:
  push:
    branches: [develop]
    tags: ["staging-*"]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME:  ${{ github.repository_owner }}/scrumdev-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/scrumdev-frontend

jobs:
  build-and-push:
    name: Build & push staging images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # push a GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Meta frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags:   ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags:   ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_GATEWAY_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # -----------------------------------------------------------------------
      # DEPLOY REAL a staging. Mismo mecanismo que prod pero al Space de staging.
      #   Backend+ML -> HF Space (git-sync). Secret HF_TOKEN_STAGING (o HF_TOKEN);
      #                 var HF_SPACE_ID_STAGING (default jaydethsp01/scrumdevai-api-staging).
      #   Frontend   -> Vercel preview hook. Secret VERCEL_STAGING_HOOK_URL.
      # Corren SOLO si su secret existe; si no, se omiten sin fallar.
      # -----------------------------------------------------------------------
      - name: Deploy backend+ML a HF Space (staging)
        if: ${{ secrets.HF_TOKEN_STAGING != '' || secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN_STAGING || secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID_STAGING || 'jaydethsp01/scrumdevai-api-staging' }}
        run: |
          set -euo pipefail
          echo "Desplegando staging -> $HF_SPACE_ID"
          git config user.email "ci@scrumdev.ai"
          git config user.name  "scrumdev-ci"
          git push --force "https://ci:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git" \
            HEAD:refs/heads/main

      - name: Deploy frontend a Vercel (staging hook)
        if: ${{ secrets.VERCEL_STAGING_HOOK_URL != '' }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_STAGING_HOOK_URL }}")
          echo "Vercel staging hook -> HTTP $code"
          test "$code" -ge 200 && test "$code" -lt 300

      - name: Aviso si no hay secrets de deploy
        if: ${{ secrets.HF_TOKEN_STAGING == '' && secrets.HF_TOKEN == '' && secrets.VERCEL_STAGING_HOOK_URL == '' }}
        run: echo "::warning::Imágenes pusheadas pero SIN deploy automático a staging (faltan secrets HF_TOKEN/VERCEL_STAGING_HOOK_URL)."
