# =============================================================================
# CD PROD
# Trigger: tags semver `v*.*.*`
# Acción:  build & push de imágenes con tag de versión + `latest` + GitHub Release
# Deploy:  step TODO comentado (SSH al VPS de producción)
# =============================================================================
name: CD Prod

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. v1.2.3) - sólo si se dispara manualmente"
        required: true

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME:  ${{ github.repository_owner }}/scrumdev-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/scrumdev-frontend

jobs:
  build-and-push:
    name: Build, push & release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # crear releases
      packages: write   # push a GHCR

    outputs:
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + changelog

      - name: Resolve version
        id: resolve-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve-version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=prod-

      - name: Meta frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve-version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=prod-

      - name: Build & push backend (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          # amd64 + arm64 para soportar VPS modernos (Hetzner CAX, Graviton, etc.)
          platforms: linux/amd64,linux/arm64
          push: true
          tags:   ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend-prod
          cache-to:   type=gha,scope=backend-prod,mode=max

      - name: Build & push frontend (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags:   ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_GATEWAY_URL=/api
          cache-from: type=gha,scope=frontend-prod
          cache-to:   type=gha,scope=frontend-prod,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.resolve-version.outputs.version }}
          name:     ScrumDev AI ${{ steps.resolve-version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Imágenes Docker
            - `${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.resolve-version.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.resolve-version.outputs.version }}`

            ## Despliegue
            ```bash
            export IMAGE_TAG=${{ steps.resolve-version.outputs.version }}
            bash scripts/deploy.sh prod
            ```

      # -----------------------------------------------------------------------
      # TODO: Deploy real al VPS de prod.
      # Secrets requeridos:
      #   PROD_HOST, PROD_USER, PROD_SSH_KEY, PROD_DEPLOY_PATH
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.2.0
      #   with:
      #     host:     ${{ secrets.PROD_HOST }}
      #     username: ${{ secrets.PROD_USER }}
      #     key:      ${{ secrets.PROD_SSH_KEY }}
      #     script: |
      #       cd ${{ secrets.PROD_DEPLOY_PATH }}
      #       export IMAGE_TAG=${{ steps.resolve-version.outputs.version }}
      #       export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
      #       export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
      #       bash scripts/deploy.sh prod
      # -----------------------------------------------------------------------
      - name: Deploy placeholder
        run: |
          echo "Release ${{ steps.resolve-version.outputs.version }} publicado."
          echo "Configura los secrets PROD_* y descomenta el step de deploy via SSH."
