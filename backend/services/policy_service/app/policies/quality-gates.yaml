policy: quality-gates
version: 1
quality_gates:
  pull_request:
    required:
      - architecture_policy_passed
      - unit_tests_passed
      - integration_tests_passed
      - security_review_passed
      - no_high_severity_violations
  release:
    required:
      - staging_deploy_successful
      - qa_validation_passed
      - human_approval

thresholds:
  min_test_coverage_percent: 60
  max_high_severity_violations: 0
  max_critical_violations: 0
