policy: architecture-policy
version: 1
architecture:
  style: modular_monolith
  layers:
    - presentation
    - application
    - domain
    - infrastructure

rules:
  - id: no_business_logic_in_controllers
    description: Los controladores no deben contener logica de negocio.
    severity: high
    pattern: "class .*Controller.*:.*\\n.*(if .* in db|session\\.|repository\\.)"
  - id: repository_for_persistence
    description: El acceso a datos debe pasar por repositorios.
    severity: high
  - id: dependency_injection_required
    description: Las dependencias se inyectan, no se instancian dentro de la logica de negocio.
    severity: medium
  - id: prefer_pure_functions_in_domain
    description: La capa de dominio debe ser pura, sin I/O.
    severity: medium
